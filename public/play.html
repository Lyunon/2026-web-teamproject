<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수사 중 · 추리 게임</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/play.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="cases.html">추리 게임</a>
    <div id="user-area"></div>
  </header>

  <main class="play">
    <!-- 좌: 사건 개요 / 단서 / 노트 -->
    <aside class="col col-left">
      <h2 id="case-title">사건</h2>
      <p id="case-intro" class="muted"></p>

      <h3>단서 보관함</h3>
      <ul id="clue-list" class="clue-list"></ul>

      <h3>추리 노트</h3>
      <textarea id="notes" class="notes" placeholder="추리한 내용을 자유롭게 적어 두세요. (이 브라우저에만 저장됩니다)"></textarea>
    </aside>

    <!-- 중: 심문 채팅 -->
    <section class="col col-chat">
      <div class="chat-head">
        <strong id="chat-title">용의자를 선택하세요</strong>
        <span id="chat-role" class="muted"></span>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="300" placeholder="질문을 입력하세요" disabled>
        <button id="chat-send" class="btn btn-primary" type="submit" disabled>보내기</button>
      </form>
    </section>

    <!-- 우: 용의자 / 조사 / 힌트 / 지목 -->
    <aside class="col col-right">
      <h3>용의자</h3>
      <ul id="suspect-list" class="suspect-list"></ul>

      <h3>현장 조사</h3>
      <div id="location-list" class="location-list"></div>
      <ul id="investigate-log" class="log-list"></ul>

      <h3>힌트 <span id="hint-count" class="muted"></span></h3>
      <button id="btn-hint" class="btn btn-ghost" type="button">힌트 받기</button>
      <ul id="hint-log" class="log-list"></ul>

      <button id="btn-accuse" class="btn btn-danger btn-block" type="button">범인 지목하기</button>
    </aside>
  </main>

  <dialog id="accuse-dialog">
    <form id="accuse-form">
      <h2>범인 지목</h2>
      <p class="muted">제출하면 사건이 종료되고 되돌릴 수 없습니다.</p>
      <fieldset class="field">
        <legend>범인은?</legend>
        <div id="accuse-suspects"></div>
      </fieldset>
      <label class="field">동기
        <textarea name="motive" rows="2" maxlength="300" placeholder="왜 범행을 저질렀나요?"></textarea>
      </label>
      <label class="field">수법
        <textarea name="method" rows="2" maxlength="300" placeholder="어떻게 범행을 저질렀나요?"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>취소</button>
        <button type="submit" class="btn btn-danger" id="accuse-submit">제출</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/play.js"></script>
</body>
</html>
