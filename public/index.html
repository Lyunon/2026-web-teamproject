<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F5 추리 수사본부 - 로그인</title>
  <link rel="stylesheet" href="./css/base.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand-logo">🕵️‍♂️ <span class="f5">F5</span> 추리 수사본부</div>
    <div class="header-right">
      <span>Gemini API 기반 인터랙티브 추리 게임</span>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="title-logo">
      <div class="hanging-lamp" aria-hidden="true"><span></span></div>
      <span class="title-kicker">INTERACTIVE MYSTERY</span>
      <h1><span class="f5">F5</span> 추리<br />수사본부</h1>
      <p class="title-tagline">거짓말은 반드시 흔적을 남긴다. 단서를 모으고, 진범을 지목하라.</p>
    </div>

    <section class="login-card">
      <span class="login-badge">DETECTIVE ARCHIVE</span>
      <h1>수사관 로그인</h1>
      <p>
        구글 계정으로 로그인하여<br />
        AI와 대화하며 미제 사건 수사를 시작하세요.
      </p>

      <div class="social-login-group">
        <!-- Google OAuth 연동 버튼 -->
        <button id="btn-login-google" class="btn-social btn-google" type="button" disabled>
          <span>G</span> Google로 시작하기
        </button>

      </div>

      <p id="login-message" class="auth-message" role="status" aria-live="polite">계정을 확인하고 있어요…</p>
      <p class="login-footer-note">처음 방문하셨나요?<br />구글 로그인 후 탐정 닉네임을 등록하면 가입이 완료돼요.</p>
    </section>
  </main>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
