<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 추리 수사관 - 로그인</title>
  <link rel="stylesheet" href="./css/base.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand-logo">🕵️‍♂️ AI 추리 수사본부</div>
    <div class="header-right">
      <span>Gemini API 기반 인터랙티브 추리 게임</span>
    </div>
  </header>

  <main class="login-wrapper">
    <section class="login-card">
      <span class="login-badge">DETECTIVE ARCHIVE</span>
      <h1>수사관 로그인</h1>
      <p>
        구글 또는 네이버 계정으로 로그인하여<br />
        제미나이 AI가 생성하는 미제 사건 수사를 시작하세요.
      </p>

      <div class="social-login-group">
        <!-- Google OAuth 연동 버튼 -->
        <button id="btn-login-google" class="btn-social btn-google" type="button">
          <span>G</span> Google 계정으로 로그인
        </button>

        <!-- Naver OAuth 연동 버튼 -->
        <button id="btn-login-naver" class="btn-social btn-naver" type="button">
          <span>N</span> 네이버 아이디로 로그인
        </button>
      </div>

      <p class="login-footer-note">
        * 현재 HTML 목업 모드로 클릭 시 사건 목록(cases.html)으로 이동합니다.<br />
        (추후 firebase.js의 Google / Naver OAuth API와 연동)
      </p>
    </section>
  </main>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
